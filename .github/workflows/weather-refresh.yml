name: Refresh weather observations

# 支援手動觸發與每 30 分鐘更新。
on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions: {}

concurrency:
  group: weather-refresh-production
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Refresh and validate response
        env:
          REFRESH_API_TOKEN: ${{ secrets.REFRESH_API_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from time import perf_counter
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          token = os.getenv("REFRESH_API_TOKEN")
          if not token or not token.strip():
              raise SystemExit("REFRESH_API_TOKEN: missing")

          request = Request(
              "https://l3-cw-av2-green.vercel.app/api/refresh",
              data=b"",
              headers={"Authorization": "Bearer " + token},
              method="POST",
          )
          started = perf_counter()
          try:
              with build_opener(NoRedirect()).open(request, timeout=75) as response:
                  status = response.status
                  payload = json.loads(response.read().decode("utf-8"))
          except HTTPError as error:
              raise SystemExit(f"Refresh failed: HTTP {error.code}") from None
          except Exception as error:
              raise SystemExit(
                  f"Refresh failed: {type(error).__name__}; inspect before retry"
              ) from None

          try:
              meta = payload["meta"]
              refresh = meta["refresh"]
              count = meta["count"]
              processed = refresh["processed_count"]
              total = refresh["database_count"]
              succeeded_at = datetime.fromisoformat(refresh["last_success_at"])
              valid = (
                  status == 200
                  and not payload.get("warning")
                  and not payload.get("error")
                  and refresh["status"] == "succeeded"
                  and refresh["error_code"] is None
                  and type(count) is int and count > 0
                  and type(processed) is int and processed == count
                  and type(total) is int and total >= count
                  and isinstance(payload["data"], list)
                  and len(payload["data"]) == count
                  and refresh["attempted_at"] == refresh["last_success_at"]
                  and succeeded_at.utcoffset() is not None
              )
          except Exception:
              raise SystemExit("Refresh failed: invalid response schema") from None

          if not valid:
              raise SystemExit("Refresh failed: update did not pass validation")

          print("HTTP status:", status)
          print("Refresh status: succeeded")
          print("Processed stations:", processed)
          print("Database rows:", total)
          print("Last success:", succeeded_at.isoformat())
          print("Elapsed seconds:", round(perf_counter() - started, 3))
          PY
